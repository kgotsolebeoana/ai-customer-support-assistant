<!DOCTYPE html>
<html>
<head>
    <title>AI Customer Support</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        #chatbox { background: white; border: 1px solid #ddd; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; }
        .user { text-align: right; margin: 10px; color: #007bff; }
        .bot { text-align: left; margin: 10px; color: #333; background: #eee; padding: 8px; border-radius: 5px; }
        #input-area { display: flex; margin-top: 10px; }
        #message { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>AI Customer Support Assistant</h2>
    <div id="chatbox"><div class="bot">Hello! How can I help you today?</div></div>
    <div id="input-area">
        <input type="text" id="message" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const msg = input.value.trim();
    if(!msg) return;
    const chatbox = document.getElementById("chatbox");
    chatbox.innerHTML += `<div class='user'>You: ${msg}</div>`;
    input.value = "";
    chatbox.scrollTop = chatbox.scrollHeight;
    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: msg})
        });
        const data = await res.json();
        chatbox.innerHTML += `<div class='bot'>Bot: ${data.reply || data.error}</div>`;
    } catch(e) {
        chatbox.innerHTML += `<div class='bot' style='color:red'>Error connecting to server</div>`;
    }
    chatbox.scrollTop = chatbox.scrollHeight;
}
</script>
</body>
</html>
